[package]
name = "git-viewer"
version = "0.1.1"
description = "A fast, focused Git viewer"
authors = ["Git Tempo Contributors"]
edition = "2021"

[lib]
name = "git_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
trash = "5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
